<!-- 통합 및 최적화된 단일 CSS 스타일시트 -->
<style>
:root{
  --paper:#FFFFFF;
  --paper-deep:#F4F7FC;
  --ink:#1A2333;
  --ink-soft:#5C6677;
  --ink-faint:#9BA3B3;
  --blue:#0C52AA;
  --blue-deep:#083875;
  --blue-tint:#EBF2FB;
  --green:#0E8F63;
  --line:#E6EAF2;
  --shadow-sm: 0 4px 12px rgba(12, 82, 170, 0.05);
  --shadow-md: 0 8px 24px rgba(12, 82, 170, 0.08);
  --shadow-lg: 0 16px 40px rgba(12, 82, 170, 0.12);
  
  --event-navy:#120B3D;
  --event-navy-2:#21115A;
  --event-sky:#12BCEB;
  --event-sky-soft:#DDF7FF;
  --event-magenta:#D91578;
  --event-magenta-soft:#FCE4F1;
  --event-yellow:#FFC629;
  --event-yellow-soft:#FFF3C9;
}
*{ box-sizing:border-box; }
html,body{ height:100%; }
body{
  margin:0;
  font-family:'Pretendard', -apple-system, BlinkMacSystemFont, 'Malgun Gothic', sans-serif;
  background:#EEF3F9; 
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
}
#app{
  width:100%; max-width:480px; margin:0 auto; height:100vh; height:100dvh; height:var(--app-h,100dvh); position:relative;
  display:flex; flex-direction:column; background:var(--paper-deep);
  box-shadow:0 0 60px rgba(0,0,0,0.08); overflow:hidden;
  isolation:isolate;
}
::-webkit-scrollbar{ width:0; height:0; }

.screen{ display:none; flex-direction:column; flex:1; height:100%; animation:slideIn .25s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; min-height:0; }
.screen.active{ display:flex; }
@keyframes slideIn{ from{opacity:0; transform:translateX(30px);} to{opacity:1; transform:translateX(0);} }
@keyframes fadeIn{ from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);} }
.content{ flex:1; overflow-y:auto; padding:0; }

/* 앱 설치, 로그아웃 버튼 영역 */
.home-action-row{display:flex!important;visibility:visible!important;gap:8px!important;max-width:220px!important;margin:14px auto 0!important;}
.home-action-btn{display:block!important;visibility:visible!important;width:96px!important;max-width:96px!important;padding:8px 7px!important;font-size:11px!important;background:#fff!important;color:#38516b!important;border:1px solid #d4dce5!important;}
.app-install-btn{display:flex;align-items:center;justify-content:center;gap:7px;width:100%;margin-top:10px;padding:11px 12px;border:1px solid #C8D7E8;border-radius:8px;background:#fff;color:#1456A8;font-family:inherit;font-size:14px;font-weight:800;letter-spacing:-.3px;cursor:pointer;transition:transform .15s ease, background .15s ease;}
.app-install-btn svg{width:16px;height:16px;flex-shrink:0;}
.app-install-btn:active{transform:scale(.97);background:#F2F7FD;}
.app-install-btn.done{color:#1A9B5A;border-color:#BFE3CF;background:#F3FBF6;cursor:default;}
html.is-standalone .app-install-btn, html.is-standalone #installAppBtn{display:none!important;}

/* HOME */
#screen-home{background:#f7f8fa!important;}
#screen-home .nh-scroll{background:linear-gradient(180deg,#ffffff 0%,#fbfcfd 38%,#f1f3f6 76%,#f7f8fa 100%)!important;background-size:100% 760px!important; padding-bottom:calc(82px + env(safe-area-inset-bottom,0px))!important;}
#screen-home .nh-hero{
  --pc-size:94px;--pc-bottom:8px;--pc-right:16px;
  position:relative!important;isolation:isolate;overflow:hidden!important;
  padding:0 0 8px!important;
  background:linear-gradient(180deg,#0d0838 0%,#130c3d calc(100% - 150px),#2a3f7c calc(100% - 112px),#8fa9d2 calc(100% - 70px),#dbe6f3 calc(100% - 38px),#ffffff calc(100% - 14px))!important;
}
#screen-home .nh-hero:before{
  content:"";position:absolute;z-index:-1;left:0;right:0;top:0;height:420px;pointer-events:none;
  background:
    radial-gradient(ellipse 150px 120px at 0% 8%,rgba(0,190,255,.85),rgba(0,190,255,0) 70%),
    radial-gradient(ellipse 170px 110px at 104% 22%,rgba(236,40,140,.80),rgba(236,40,140,0) 70%),
    radial-gradient(ellipse 190px 120px at 100% 62%,rgba(0,170,245,.55),rgba(0,170,245,0) 70%),
    radial-gradient(ellipse 200px 120px at -4% 60%,rgba(255,176,30,.80),rgba(255,176,30,0) 70%),
    radial-gradient(ellipse 160px 100px at 58% 100%,rgba(236,40,140,.35),rgba(236,40,140,0) 70%);
  filter:blur(6px);
}
#screen-home .nh-top{
  min-height:0!important;padding:calc(34px + env(safe-area-inset-top,0px)) 22px 8px!important;
  background:transparent!important;border-radius:0!important;box-shadow:none!important;overflow:visible!important;
  position:relative!important;
}
#screen-home .event-brand-lockup{position:relative!important;padding-right:0!important;max-width:100%!important;box-sizing:border-box!important}
#screen-home .event-title-line{font-family:'Pretendard',sans-serif!important;font-size:clamp(40px,12.5vw,54px)!important;font-weight:900!important;letter-spacing:-2px!important;line-height:1!important;color:#fff!important;text-shadow:0 4px 22px rgba(0,0,0,.25)}
#screen-home .event-title-line span{color:#fff!important;font-weight:900!important;background:linear-gradient(100deg,#fff 30%,#8fe3ff 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
#screen-home .nh-title{margin:10px 0 0!important;font-size:clamp(21px,6.4vw,28px)!important;font-weight:800!important;letter-spacing:-.8px!important;line-height:1.2!important;color:#fff!important;white-space:nowrap}
#screen-home .nh-meta{margin-top:12px!important;font-size:12px!important;font-weight:600!important;letter-spacing:.6px!important;color:rgba(255,255,255,.62)!important}
#screen-home .nh-meta i{font-style:normal;color:#ffd24a;padding:0 5px}
#screen-home .nh-dday-stack{position:absolute!important;top:calc(16px + env(safe-area-inset-top,0px))!important;right:20px!important;left:auto!important;z-index:8!important;display:flex!important;align-items:flex-end!important}
#screen-home .nh-dday{display:block!important;position:static!important;margin:0!important;
  background:linear-gradient(135deg,#ffd24a,#ff9a2e)!important;color:#1a1245!important;border:0!important;
  padding:6px 14px!important;font-size:12.5px!important;font-weight:900!important;letter-spacing:.3px;border-radius:999px;
  box-shadow:0 4px 12px rgba(255,154,46,.4)}

#screen-home .nh-greeting-row{
  position:static!important;display:block!important;padding:8px 16px 12px!important;min-height:0!important;margin-top:0!important;
  padding-right:calc(var(--pc-size) + var(--pc-right) + 10px)!important;box-sizing:border-box!important;
}
#screen-home .nh-hello{
  display:block!important;width:100%!important;box-sizing:border-box!important;font-size:clamp(18px,5vw,22px)!important;line-height:1.25!important;white-space:normal!important;padding-right:0!important;
  color:#fff!important;font-weight:500!important;
}
#screen-home .nh-hello b{font-size:1.08em!important;color:#ffd24a!important;font-weight:800!important;}
#screen-home .nh-hello span{display:block!important;margin:2px 0 0!important;color:#78E4FF!important;font-size:.82em!important;font-weight:800!important;line-height:1.2!important;white-space:normal!important}

#screen-home .nh-right{position:static!important;max-width:none!important;}
#screen-home .photo-contest-btn{
  position:absolute!important;z-index:6!important;
  left:auto!important;top:auto!important;
  right:var(--pc-right)!important;bottom:var(--pc-bottom)!important;
  width:var(--pc-size)!important;height:var(--pc-size)!important;
  min-width:0!important;max-width:none!important;aspect-ratio:1/1!important;
  margin:0!important;padding:6px 4px!important;box-sizing:border-box!important;
  display:flex!important;flex-direction:column!important;align-items:center!important;justify-content:center!important;gap:6px!important;
  border-radius:14px!important;
  border:1px solid rgba(255,255,255,.55)!important;
  background:linear-gradient(145deg,#17133F 0%,#29205E 55%,#124C91 100%)!important;
  box-shadow:0 7px 18px rgba(15,20,65,.22)!important;
  color:#fff!important;cursor:pointer;
}
#screen-home .photo-contest-btn:active{transform:scale(.96)}
#screen-home .photo-contest-btn .pc-cam{width:27px!important;height:27px!important;color:var(--event-yellow)!important;}
#screen-home .photo-contest-btn .pc-txt{display:flex;flex-direction:column;align-items:center!important;gap:5px!important;text-align:center!important}
#screen-home .photo-contest-btn .pc-txt b{font-size:12px!important;font-weight:900!important;white-space:nowrap!important}
#screen-home .photo-contest-btn .pc-txt em{font-size:10.5px!important;font-weight:900!important;color:var(--event-navy)!important;background:var(--event-yellow)!important;border-radius:999px;padding:3px 7px!important;white-space:nowrap}
#screen-home .photo-contest-btn .pc-side, #screen-home .photo-contest-btn .pc-arrow{display:none!important}

#screen-home .nh-sec-round{display:flex!important;align-items:center;justify-content:space-between;margin:0!important;padding:0 18px!important;position:relative;z-index:2}
#screen-home .nh-sec h2{color:#155bb8!important; margin:0!important;font-family:var(--serif);font-size:26px;font-weight:700;letter-spacing:.2px;font-style:italic;}
#screen-home .home-weather-link{display:flex;align-items:center;justify-content:center;gap:7px;width:max-content;max-width:calc(100% - 32px);margin:0 18px 8px auto!important;padding:7px 11px;border:1px solid rgba(24,50,100,.14);border-radius:999px;background:rgba(255,255,255,.78);color:#182b49;text-decoration:none;font-size:12.5px;font-weight:800;line-height:1.2;box-shadow:0 3px 9px rgba(18,35,80,.06);align-self:flex-end!important}

/* My Round Cards */
.mr-card{
  background:#fffdf8!important;border:1.5px solid rgba(33,17,90,.28)!important;border-radius:16px!important;
  box-shadow:0 9px 24px rgba(18,11,61,.12)!important;overflow:hidden!important;margin:4px 16px 0!important;
}
.mr2-top{
  background:
    radial-gradient(ellipse at 100% 0%,rgba(18,188,235,.52) 0%,transparent 48%),
    radial-gradient(ellipse at 0% 100%,rgba(217,21,120,.40) 0%,transparent 48%),

  color:#fff!important;border-bottom:1px solid rgba(255,255,255,.45)!important;border-radius:0!important;padding:15px 17px!important;
}
.mr2-top-lab{color:var(--event-yellow)!important;font-size:12px!important;font-weight:800!important;}

.mr2-tile.tile-tee{background:#e4f1ff!important;border-color:#7db6ed!important}

/* Player Tools */
.tool-grid{display:grid!important;grid-template-columns:1fr!important;gap:0!important;margin:0 16px!important;padding:4px 12px!important;border:1px solid #D9DDF0!important;border-radius:18px!important;background:linear-gradient(145deg,#F8F8FD,#EDF1FB)!important;overflow:hidden!important;box-shadow:0 6px 18px rgba(20,25,75,.07)!important}

<style>
:root{
  --paper:#FFFFFF;
  --paper-deep:#F4F7FC;
  --ink:#1A2333;
  --ink-soft:#5C6677;
  --ink-faint:#9BA3B3;
  --blue:#0C52AA;
  --blue-deep:#083875;
  --blue-tint:#EBF2FB;
  --green:#0E8F63;
  --line:#E6EAF2;
  --shadow-sm: 0 4px 12px rgba(12, 82, 170, 0.05);
  --shadow-md: 0 8px 24px rgba(12, 82, 170, 0.08);
  --shadow-lg: 0 16px 40px rgba(12, 82, 170, 0.12);
}
*{ box-sizing:border-box; }
html,body{ height:100%; }
body{
  margin:0;
  font-family:'Pretendard', -apple-system, BlinkMacSystemFont, 'Malgun Gothic', sans-serif;
  background:#EEF3F9; 
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
}
#app{
  width:100%; max-width:480px; margin:0 auto; height:100vh; height:100dvh; height:var(--app-h,100dvh); position:relative;
  display:flex; flex-direction:column; background:var(--paper-deep);
  box-shadow:0 0 60px rgba(0,0,0,0.08); overflow:hidden;
}
::-webkit-scrollbar{ width:0; height:0; }

/* ---------- 화면 전환 효과 ---------- */
.screen{
  display:none; flex-direction:column; flex:1; height:100%;
  animation:slideIn .25s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
}
.screen.active{ display:flex; }
@keyframes slideIn{ from{opacity:0; transform:translateX(30px);} to{opacity:1; transform:translateX(0);} }
@keyframes fadeIn{ from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);} }

/* ---------- HOME ACTIONS / FOOTER ---------- */
.home-action-row{display:flex;justify-content:center;align-items:center;gap:12px;margin:18px auto 0;width:100%;max-width:340px;}
.home-action-btn{flex:1;max-width:160px;border:0;border-radius:10px;padding:11px 12px;background:#eef4fb;color:var(--blue-deep);font-size:13px;font-weight:800;cursor:pointer;}
.home-footer{padding:28px 20px 18px;text-align:center;color:#6f7f91;font-size:12px;font-weight:700;}
.attendee-filter-row{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;padding:12px 16px 8px;background:#fff;}
.attendee-filter-btn{border:1px solid #d8e2ee;background:#fff;color:#536477;border-radius:8px;padding:10px 3px;font-size:12px;font-weight:800;cursor:pointer;}
.attendee-filter-btn.active{background:var(--blue-deep);border-color:var(--blue-deep);color:#fff;}

/* ---------- COVER ---------- */
#screen-cover{
  justify-content:center; align-items:center; padding:24px 17px 70px;
  background:linear-gradient(145deg,#FFFFFF 0%,#EDF3FA 100%);
  text-align:center; animation:fadeIn .3s ease forwards;
  min-height:100%;
}
.login-box-golf{
  background:#fff; width:100%; max-width:340px; border-radius:14px;
  padding:30px 24px 26px; box-shadow:0 10px 25px rgba(0,0,0,.08);
}
.cover-logo{ width:150px; max-width:55vw; height:auto; margin:0 auto 16px; object-fit:contain; display:block; }
.cover-title{
  font-size:19px; font-weight:900; color:#111827; line-height:1.45;
  margin-bottom:5px; letter-spacing:-0.6px; word-break:keep-all;
}
.cover-sub{ font-size:12px; color:#667085; margin-bottom:20px; font-weight:500; line-height:1.45; }
.enter-btn{
  width:100%; padding:12px; border:none; border-radius:8px;
  background:#1456A8; color:#fff; font-size:15px; font-weight:800;
  cursor:pointer; transition:transform .15s ease; font-family:inherit;
  margin-top:6px; margin-bottom:0;
}
.enter-btn:active{ transform:scale(0.97); }
.enter-btn:disabled{ background:#A0AEC0; cursor:not-allowed; }
.login-input-golf{
  width:100%; padding:11px 12px; border:1px solid #E2E8F0; border-radius:8px;
  font-size:14px; margin-bottom:10px; outline:none; font-family:inherit;
  color:var(--ink);
}
.login-input-golf:focus{ border-color:#1456A8; }
.login-error-golf{
  color:#E53E3E; font-size:12px; margin:0 0 10px; line-height:1.45;
  display:none;
}
.cover-foot{ margin-top:20px; font-size:11px; color:#AAB3C2; font-weight:600;}

/* ---------- HOME 상단 개요 ---------- */
.home-header-clean{
  flex-shrink:0; padding:40px 16px 20px;
  border-bottom-left-radius:0; border-bottom-right-radius:0;
  box-shadow:none; z-index:10; position:relative; overflow:hidden;
  background-image:
    linear-gradient(100deg,
      rgba(255,255,255,0.97) 0%,
      rgba(255,255,255,0.94) 32%,
      rgba(255,255,255,0.72) 52%,
      rgba(255,255,255,0.40) 68%,
      rgba(255,255,255,0.20) 100%),
    linear-gradient(0deg, rgba(235,242,251,0.35), rgba(235,242,251,0.35)),
    url('https://images.unsplash.com/photo-1742498626135-67a7d3501eff?fm=jpg&q=80&w=1200&auto=format&fit=crop');
  background-size:cover, cover, cover;
  background-position:center, center, 78% 42%;
  background-repeat:no-repeat;
}
.header-content-wrap{ position:relative; z-index:2; width:100%; }

.title-year{font-size:20px;font-weight:800;color:var(--blue);margin-bottom:4px;margin-left:10px;}
.title-main{
  font-size:38px; font-weight:900; color:var(--blue-deep); 
  line-height:1.18; letter-spacing:-1px; margin-bottom:25px; margin-left:10px; word-break:keep-all;
}

.info-box {
    display:flex; flex-direction:column; gap:12px;
    padding-left:16px; border-left:3px solid var(--blue-tint);
}
.info-row { display:flex; align-items:flex-start; gap:8px; font-size:14px; line-height:1.6; color:var(--ink-soft); }
.info-icon { font-size:15px; color:var(--blue); flex-shrink:0;}
.info-text { word-break:keep-all; letter-spacing:-0.5px; }
.info-text strong { color:var(--ink); font-weight:800; }
.info-subtext { color:var(--ink-soft); display:inline; margin-left:2px; }

/* ---------- HOME 본문 (버튼 리스트) ---------- */
.home-content{ flex:1; overflow-y:auto; padding:18px 20px 20px; display:flex; flex-direction:column; gap:10px; }
.home-menu-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;}
.home-menu-grid .btn-premium{min-height:80px;padding:13px 12px;gap:9px;flex-direction:row;align-items:center;justify-content:center;position:relative;}
.home-menu-grid .btn-icon-wrap{width:33px;height:33px;border-radius:10px;font-size:14px;}
.home-menu-grid .btn-title{font-size:14px;line-height:1.3;}
.home-menu-grid .btn-desc{font-size:11px;line-height:2.0;}
.home-menu-grid .btn-arrow{display:none;}
.attendee-search-wrap{padding:14px 20px 10px;position:sticky;top:0;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);z-index:20;border-bottom:1px solid var(--line);}
.attendee-count{padding:10px 20px 4px;font-size:12px;color:var(--ink-soft);font-weight:700;}
.attendee-table-wrap{padding:8px 16px 40px;overflow-x:auto;}
.attendee-table{width:100%;border-collapse:separate;border-spacing:0;background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--shadow-sm);font-size:12.5px;table-layout:fixed;}
.attendee-table th{background:var(--paper-deep);color:var(--ink-soft);font-weight:800;padding:11px 7px;border-bottom:1px solid var(--line);text-align:center;}
.attendee-table td{padding:11px 7px;border-bottom:1px solid var(--line);color:var(--ink);line-height:1.4;vertical-align:middle;word-break:keep-all;}
.attendee-table tr:last-child td{border-bottom:none;}
.attendee-table th:nth-child(1),.attendee-table td:nth-child(1){width:42px;text-align:center;color:var(--ink-soft);}
.attendee-table th:nth-child(2),.attendee-table td:nth-child(2){width:76px;text-align:center;font-weight:800;}
.attendee-table th:nth-child(4),.attendee-table td:nth-child(4){width:130px;text-align:center;color:var(--ink-soft);}
.attendee-name{color:var(--blue-deep);font-weight:800;}
.attendee-empty{text-align:center;padding:36px 15px!important;color:var(--ink-faint)!important;}


.btn-premium {
    display:flex; align-items:center; gap:14px;
    width:100%; padding:14px 16px; border-radius:18px; border:1px solid rgba(255,255,255,0.9);
    background:linear-gradient(135deg, rgba(255,255,255,1) 0%, rgba(240,245,255,0.6) 100%);
    color:var(--ink); font-size:17px; font-weight:800; text-align:left;
    box-shadow: 8px 8px 20px rgba(12, 82, 170, 0.06), -4px -4px 12px rgba(255, 255, 255, 1);
    cursor:pointer; transition:all 0.15s ease; font-family:inherit;
}
.btn-premium:active {
    transform:translateY(2px) scale(0.98);
    box-shadow: 2px 2px 8px rgba(12, 82, 170, 0.05), -2px -2px 8px rgba(255, 255, 255, 0.9);
}
.btn-icon-wrap {
    width:42px; height:42px; border-radius:12px; background:var(--blue-tint);
    display:flex; align-items:center; justify-content:center; font-size:20px;
    color:var(--blue); flex-shrink:0;
}
.btn-text-wrap { flex:1; }
.btn-title { font-size:16px; font-weight:800; color:var(--blue-deep); margin-bottom:2px; word-break:keep-all;}
.btn-desc { font-size:12px; font-weight:500; color:var(--ink-soft); word-break:keep-all;}
.btn-arrow { font-size:14px; color:var(--ink-faint); flex-shrink:0;}

/* ---------- 앱 설치 (입장 화면 버튼 + 안내 시트) ---------- */
html.is-standalone .app-install-btn,
html.is-standalone #installAppBtn{display:none!important;}
.app-install-btn{
  display:flex; align-items:center; justify-content:center; gap:7px;
  width:100%; margin-top:10px; padding:11px 12px;
  border:1px solid #C8D7E8; border-radius:8px; background:#fff; color:#1456A8;
  font-family:inherit; font-size:14px; font-weight:800; letter-spacing:-.3px;
  cursor:pointer; transition:transform .15s ease, background .15s ease;
}
.app-install-btn svg{width:16px;height:16px;flex-shrink:0;}
.app-install-btn:active{transform:scale(.97);background:#F2F7FD;}
.app-install-btn.done{color:#1A9B5A;border-color:#BFE3CF;background:#F3FBF6;cursor:default;}

.ai-sheet{position:fixed;inset:0;z-index:100000;display:none;align-items:flex-end;justify-content:center;background:rgba(12,22,35,.5);backdrop-filter:blur(4px);}
.ai-sheet.open{display:flex;}
.ai-panel{position:relative;width:100%;max-width:440px;background:#fff;border-radius:20px 20px 0 0;padding:22px 20px calc(18px + env(safe-area-inset-bottom,0px));box-shadow:0 -12px 40px rgba(0,0,0,.2);text-align:left;animation:aiUp .22s ease-out;}
@keyframes aiUp{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
.ai-close{position:absolute;top:10px;right:12px;width:34px;height:34px;border:0;background:transparent;color:#8A97A8;font-size:24px;line-height:1;cursor:pointer;}
.ai-head{display:flex;align-items:center;gap:12px;padding-right:30px;}
.ai-icon{width:48px;height:48px;border-radius:12px;flex-shrink:0;box-shadow:0 4px 12px rgba(20,70,50,.16);object-fit:cover;}
.ai-panel h3{margin:0;font-size:17px;font-weight:900;color:var(--ink);letter-spacing:-.4px;line-height:1.35;word-break:keep-all;}
.ai-body{margin:14px 0 0;font-size:13.5px;line-height:1.65;font-weight:600;color:var(--ink-soft);word-break:keep-all;}
.ai-body b,.ai-steps b{color:#1456A8;font-weight:800;}
.ai-steps{list-style:none;margin:14px 0 0;padding:0;display:grid;gap:10px;}
.ai-steps li{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;line-height:1.55;font-weight:600;color:var(--ink);word-break:keep-all;}
.ai-n{flex:0 0 22px;height:22px;border-radius:50%;background:#1456A8;color:#fff;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;margin-top:1px;}
.ai-steps small{display:block;margin-top:2px;font-size:12px;font-weight:600;color:#7B8798;}
.ai-actions{display:grid;gap:8px;margin-top:18px;}
.ai-btn{height:46px;border-radius:10px;font-family:inherit;font-size:14.5px;font-weight:800;cursor:pointer;}
.ai-btn.primary{background:#1456A8;border:1px solid #1456A8;color:#fff;}
.ai-btn.ghost{background:#fff;border:1px solid #D5E0EC;color:#4A5C70;}
.ai-btn:active{transform:scale(.98);}
.ai-point{display:flex;flex-direction:column;align-items:center;gap:2px;margin-top:12px;color:#1456A8;font-size:12px;font-weight:700;}
.ai-point svg{width:26px;height:26px;animation:aiBob 1.1s ease-in-out infinite;}
@keyframes aiBob{0%,100%{transform:translateY(0)}50%{transform:translateY(6px)}}
.ai-sheet [hidden]{display:none!important;}
@media(prefers-reduced-motion:reduce){.ai-panel,.ai-point svg{animation:none;}}

/* ---------- 서브페이지 공통 ---------- */
.topbar{ flex-shrink:0; display:flex; align-items:center; gap:12px; padding:16px 20px 12px; background:rgba(255,255,255,0.95); backdrop-filter:blur(10px); border-bottom:1px solid var(--line); z-index:30; }
.back-btn{ width:36px; height:36px; border-radius:50%; border:1px solid var(--line); display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--ink); transition:transform .15s; flex-shrink:0; background:#fff; font-size:18px; font-weight:300;}
.back-btn:active{ transform:scale(0.9); }
.topbar-title{ font-size:17px; font-weight:800; color:var(--ink); display:flex; align-items:center; white-space:nowrap;}
.content{ flex:1; overflow-y:auto; padding:0; }

/* ---------- 행사 프로그램 표 ---------- */
.program-wrap { padding:20px; }
.prog-table{ width:100%; border-collapse:collapse; background:#fff; border-radius:16px; overflow:hidden; box-shadow:var(--shadow-sm); font-size:13px; }
.prog-table th{ background:var(--paper-deep); color:var(--ink-soft); font-weight:700; padding:12px 10px; font-size:13px; border-bottom:1px solid var(--line); text-align:center;}
.

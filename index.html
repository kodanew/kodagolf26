<style>
:root{
  --paper:#FFFFFF;
  --paper-deep:#F4F7FC;
  --ink:#1A2333;
  --ink-soft:#5C6677;
  --ink-faint:#9BA3B3;
  --blue:#0C52AA;
  --blue-deep:#083875;
  --blue-tint:#EBF2FB;
  --green:#0E8F63;
  --line:#E6EAF2;
  --shadow-sm: 0 4px 12px rgba(12, 82, 170, 0.05);
  --shadow-md: 0 8px 24px rgba(12, 82, 170, 0.08);
  --shadow-lg: 0 16px 40px rgba(12, 82, 170, 0.12);
}
*{ box-sizing:border-box; }
html,body{ height:100%; }
body{
  margin:0;
  font-family:'Pretendard', -apple-system, BlinkMacSystemFont, 'Malgun Gothic', sans-serif;
  background:#EEF3F9; 
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
}
#app{
  width:100%; max-width:480px; margin:0 auto; height:100vh; height:100dvh; height:var(--app-h,100dvh); position:relative;
  display:flex; flex-direction:column; background:var(--paper-deep);
  box-shadow:0 0 60px rgba(0,0,0,0.08); overflow:hidden;
}
::-webkit-scrollbar{ width:0; height:0; }

/* ---------- 화면 전환 효과 ---------- */
.screen{
  display:none; flex-direction:column; flex:1; height:100%;
  animation:slideIn .25s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
}
.screen.active{ display:flex; }
@keyframes slideIn{ from{opacity:0; transform:translateX(30px);} to{opacity:1; transform:translateX(0);} }
@keyframes fadeIn{ from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);} }

/* ---------- COVER (대회 종료 안내 화면) ---------- */
#screen-cover{
  justify-content:center; align-items:center; padding:24px 20px;
  background:linear-gradient(145deg,#FFFFFF 0%,#EDF3FA 100%);
  text-align:center; animation:fadeIn .3s ease forwards;
  min-height:100%;
}
.closing-box{
  background:#fff; width:100%; max-width:360px; border-radius:20px;
  padding:32px 22px 28px; box-shadow:0 12px 35px rgba(12,82,170,.12);
  display:flex; flex-direction:column; align-items:center;
}
.closing-logo{ width:120px; max-width:45vw; height:auto; margin:0 auto 16px; object-fit:contain; display:block; }
.closing-title{
  font-size:18px; font-weight:900; color:#0C52AA; line-height:1.4;
  margin-bottom:14px; letter-spacing:-0.5px; word-break:keep-all;
}
.closing-message{
  font-size:16px; font-weight:800; color:#1A2333; line-height:1.5;
  margin-bottom:20px; word-break:keep-all;
}
.closing-img-wrap{
  width:100%; border-radius:14px; overflow:hidden; margin-bottom:18px;
  border:1px solid #E2E8F0; background:#F8FAFC;
}
.closing-img{
  width:100%; height:auto; max-height:260px; object-fit:cover; display:block;
}
.closing-foot{ font-size:12px; color:#718096; font-weight:700; }

/* ---------- 서브페이지 공통 ---------- */
.topbar{ flex-shrink:0; display:flex; align-items:center; gap:12px; padding:16px 20px 12px; background:rgba(255,255,255,0.95); backdrop-filter:blur(10px); border-bottom:1px solid var(--line); z-index:30; }
.back-btn{ width:36px; height:36px; border-radius:50%; border:1px solid var(--line); display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--ink); transition:transform .15s; flex-shrink:0; background:#fff; font-size:18px; font-weight:300;}
.back-btn:active{ transform:scale(0.9); }
.topbar-title{ font-size:17px; font-weight:800; color:var(--ink); display:flex; align-items:center; white-space:nowrap;}
.content{ flex:1; overflow-y:auto; padding:0; }

/* ---------- KODA signature animated splash ---------- */
#app{visibility:hidden;}
#golfSplash{position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;overflow:hidden;
 background:radial-gradient(ellipse at 50% 40%,#fff 0%,#f8fafc 48%,#e9edf3 100%);
 pointer-events:auto;transition:opacity .55s ease,visibility .55s ease;}
#golfSplash.hide{opacity:0;visibility:hidden;pointer-events:none;}
.koda-splash-scene{position:relative;width:min(88vw,390px);height:430px;max-height:78vh;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.splash-symbol-wrap{width:69px;height:69px;display:grid;place-items:center;position:relative;z-index:2;animation:symbol-arrive 1.2s cubic-bezier(.2,.8,.2,1) both;}
.splash-symbol{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 10px 20px rgba(7,61,133,.12));animation:symbol-turn 2.4s cubic-bezier(.2,.75,.2,1) both;}
.splash-orbit{position:absolute;left:50%;top:37%;width:180px;height:180px;border:1px solid rgba(7,61,133,.18);border-radius:50%;transform:translate(-50%,-50%) scale(.72);opacity:0;animation:orbit-in 1.6s ease-out .15s both;}
.orbit-b{width:224px;height:224px;border-color:rgba(7,61,133,.09);animation-delay:.32s;}
.splash-wordmark{margin-top:27px;opacity:0;transform:translateY(12px);animation:word-reveal .75s ease-out .62s forwards;} .splash-logo{display:block;width:69px;height:auto;object-fit:contain;}
.splash-caption{margin-top:12px;font:600 9px/1.4 'Pretendard',Arial,sans-serif;letter-spacing:2.5px;color:#8a96a7;opacity:0;animation:word-reveal .7s ease-out .9s forwards;}
.splash-loader{margin-top:35px;width:112px;height:2px;background:#dfe5ed;border-radius:4px;overflow:hidden;}
.splash-loader span{display:block;width:42%;height:100%;background:linear-gradient(90deg,#0a4b9b,#8baedb);animation:load-sweep 1.25s ease-in-out infinite;}
@keyframes symbol-arrive{0%{opacity:0;transform:translateY(20px) scale(.78)}65%{opacity:1;transform:translateY(-3px) scale(1.035)}100%{opacity:1;transform:translateY(0) scale(1)}}
@keyframes symbol-turn{0%{transform:rotate(-32deg) scale(.88)}65%{transform:rotate(8deg) scale(1.03)}100%{transform:rotate(0) scale(1)}}
@keyframes orbit-in{0%{opacity:0;transform:translate(-50%,-50%) scale(.55) rotate(-35deg)}55%{opacity:1}100%{opacity:.7;transform:translate(-50%,-50%) scale(1) rotate(25deg)}}
@keyframes word-reveal{to{opacity:1;transform:translateY(0)}}
@keyframes load-sweep{0%{transform:translateX(-120%)}100%{transform:translateX(280%)}}
@media(max-width:380px){.koda-splash-scene{transform:scale(.88)}}
@media(prefers-reduced-motion:reduce){.splash-symbol,.splash-symbol-wrap,.splash-orbit,.splash-wordmark,.splash-caption,.splash-loader span{animation-duration:.01ms!important;animation-iteration-count:1!important;opacity:1;transform:none;}}
</style>

</head>
<body>
<div id="golfSplash" aria-hidden="true">
  <div class="koda-splash-scene">
    <div class="splash-orbit orbit-a"></div><div class="splash-orbit orbit-b"></div>
    <div class="splash-symbol-wrap"><img class="splash-symbol" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAU0AAAFGCAYAAADuN80HAAAQAElEQVR4Aez9B4BlR3Umjn9VdcO7L3QcjbIAIZIQSiMhQCzYKOGw+3MWSQSRJIGIXximk8P6NbUxi~..." alt=""></div>
    <img class="splash-wordmark splash-logo" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAATgAAABlCAYAAADZGP/3AAAQAElEQVR4Aey9B4BdR3U3/puZW1/dVgrpJCKlZgXZsra+97u31X2ve93X~..." alt="KODA">
    <div class="splash-caption">KOREA DEVELOPER ASSOCIATION</div>
    <div class="splash-loader"><span></span></div>
  </div>
</div>
<script>
(function(){
  function startGolfSplash(){
    const splash=document.getElementById('golfSplash');
    const app=document.getElementById('app');
    if(!splash || !app) return;
    splash.classList.add('hide');
    app.style.visibility='visible';
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',startGolfSplash,{once:true});
  else startGolfSplash();
})();
</script>

<div id="app">
  <!-- ================= COVER (대회 종료 안내 화면) ================= -->
  <section id="screen-cover" class="screen active">
    <div class="closing-box">
      <img src="koda-logo-re.png" class="closing-logo" alt="KODA">
      <div class="closing-title">2026 KODA 협회장배 골프대회</div>
      <div class="closing-message">협회장배 골프대회가<br>성황리에 잘 마쳤습니다.</div>
      <div class="closing-img-wrap">
        <!-- 대회 종료 기념 이미지 (원하시는 이미지 URL로 교체 가능합니다) -->
        <img src="https://images.unsplash.com/photo-1535131749006-b7f58c99034b?fm=jpg&q=80&w=800&auto=format&fit=crop" class="closing-img" alt="대회 성황리 종료 기념 이미지">
      </div>
      <div class="closing-foot">참석해 주신 모든 분께 진심으로 감사드립니다.</div>
    </div>
  </section>
</div>
